name: Greetings

on: [pull_request_target, issues]

permissions: {}

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: |
            Thanks for opening your first issue on **gin-guard**!

            To help us triage quickly, please make sure your report includes:
            - A clear reproduction (a short Go snippet or failing test is ideal)
            - Output of `go version` and which Go toolchain you build with (`go 1.25.x` or later)
            - The module version you depend on (pin a commit until the first tag) and your `go.mod` requires
            - The `guard-core-go` engine version and the Gin version you use
            - Redis configuration if relevant (the engine uses Redis for distributed bans, rate limiting, and cloud IP ranges)

            A few pointers:
            - Scan [README.md](../blob/master/README.md) for usage guidance, and [guard-core-go](https://github.com/rennf93/guard-core-go) for engine behavior and configuration.
            - **Security vulnerability?** Do **not** open a public issue - please use GitHub's private vulnerability reporting.

            Thanks again - a maintainer will be with you soon.
        pr_message: |
            Thanks for opening your first pull request on **gin-guard**!

            Quick checklist before review (most of these are enforced by CI, but worth a glance):
            - [ ] The PR body says `Closes #N` for an open issue (the `issue-link` check enforces it); chores take the `no-issue` label
            - [ ] `gofmt -l .` reports no files
            - [ ] `go vet ./...` is clean
            - [ ] `go test ./...` passes (add `-tags integration` with Redis for the integration suite)
            - [ ] `go build ./...` compiles the adapter and the example apps
            - [ ] `govulncheck ./...` is clean
            - [ ] No `nolint` / unchecked-error shortcuts; pre-existing violations in touched files are fixed
            - [ ] If you changed adapter behavior, it stays aligned with [nethttp-guard](https://github.com/rennf93/nethttp-guard) and the README reflects it

            See [README.md](../blob/master/README.md) for the adapter contract and [AGENTS.md](../blob/master/AGENTS.md) for the boundary rules.

            Welcome aboard - a maintainer will review shortly.
